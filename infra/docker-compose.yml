name: djafat-dev

services:
  postgres:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_USER: djafat
      POSTGRES_PASSWORD: djafat_local_dev
      POSTGRES_DB: djafat
    command: ['postgres', '-c', 'max_connections=100', '-c', 'log_statement=none']
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U djafat -d djafat']
      interval: 5s
      timeout: 3s
      retries: 20

  # Transaction pooling — the app connects here (port 6432), migrations use 5432.
  pgbouncer:
    image: edoburu/pgbouncer:v1.23.1-p2
    environment:
      DB_HOST: postgres
      DB_USER: djafat
      DB_PASSWORD: djafat_local_dev
      DB_NAME: djafat
      POOL_MODE: transaction
      MAX_CLIENT_CONN: '500'
      DEFAULT_POOL_SIZE: '25'
      AUTH_TYPE: scram-sha-256
    ports:
      - '6432:6432'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -p 6432 -U djafat || exit 1']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - '1025:1025'
      - '8025:8025'

  mock-psp:
    build:
      context: ./mock-psp
    environment:
      PORT: '4010'
    ports:
      - '4010:4010'

  mock-sms:
    build:
      context: ./mock-sms
    environment:
      PORT: '4020'
    ports:
      - '4020:4020'

volumes:
  pgdata:
  miniodata:
