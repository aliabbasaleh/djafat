name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  check:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @djafat/api run db:generate

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  integration:
    name: integration (postgres + redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_USER: djafat
          POSTGRES_PASSWORD: djafat_ci
          POSTGRES_DB: djafat
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U djafat" --health-interval 5s
          --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://djafat:djafat_ci@localhost:5432/djafat?schema=public
      DIRECT_DATABASE_URL: postgresql://djafat:djafat_ci@localhost:5432/djafat?schema=public
      REDIS_URL: redis://localhost:6379
      OBJECT_STORAGE_ENDPOINT: http://localhost:9000
      OBJECT_STORAGE_REGION: eu-west-par
      OBJECT_STORAGE_BUCKET: djafat-ci
      OBJECT_STORAGE_ACCESS_KEY_ID: ci
      OBJECT_STORAGE_SECRET_ACCESS_KEY: ci
      API_PUBLIC_URL: http://localhost:3001
      PAYMENT_WEBHOOK_BASE_URL: http://localhost:3001/v1/payments/webhook
      # The five auth/crypto variables `ApiEnvSchema` requires without a
      # default. They were missing, so this job could not boot the app at all:
      # every suite died in `beforeAll` with `ConfigValidationError` and its
      # tests were reported SKIPPED, which vitest does not fail on loudly --
      # the job went green over 93 tests that never ran. Throwaway CI values,
      # never reused anywhere: the real secrets live in the secret manager
      # (docs/12), and `MFA_ENCRYPTION_KEY`/`DELIVERY_CODE_ENCRYPTION_KEY` must
      # be 32 raw bytes base64-encoded (AES-256-GCM) and must differ from each
      # other -- one leak must not span two secret domains.
      JWT_ACCESS_SECRET: ci-jwt-access-secret-not-used-anywhere-else
      REFRESH_TOKEN_HASH_SECRET: ci-refresh-token-hash-secret-not-used-anywhere-else
      OTP_HASH_SECRET: ci-otp-hash-secret-not-used-anywhere-else
      MFA_ENCRYPTION_KEY: Y2ktbWZhLWVuY3J5cHRpb24ta2V5LTMyLWJ5dGVzISE=
      DELIVERY_CODE_ENCRYPTION_KEY: Y2ktZGVsaXZlcnktY29kZS1rZXktMzItYnl0ZXMhISE=
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @djafat/api run db:generate

      - name: Apply migrations
        run: pnpm --filter @djafat/api run db:migrate

      - name: Seed
        run: pnpm --filter @djafat/api run db:seed

      - name: Integration tests
        run: pnpm --filter @djafat/api run test:int
