name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  check:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @djafat/api run db:generate

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # Feature pipeline checks (docs/pipeline/README.md §5): graph-wide
      # architecture, spec/test traceability, test/suppression hygiene, and the
      # tests of that tooling. Same install/cache as above, no extra job.
      - name: Spec & traceability check
        run: pnpm check:specs

      - name: Test & suppression hygiene
        run: pnpm check:hygiene

      - name: Architecture check
        run: pnpm check:arch

      - name: Pipeline tooling tests
        run: pnpm check:pipeline

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  integration:
    name: integration (postgres + redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_USER: djafat
          POSTGRES_PASSWORD: djafat_ci
          POSTGRES_DB: djafat
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U djafat" --health-interval 5s
          --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://djafat:djafat_ci@localhost:5432/djafat?schema=public
      DIRECT_DATABASE_URL: postgresql://djafat:djafat_ci@localhost:5432/djafat?schema=public
      REDIS_URL: redis://localhost:6379
      OBJECT_STORAGE_ENDPOINT: http://localhost:9000
      OBJECT_STORAGE_REGION: eu-west-par
      OBJECT_STORAGE_BUCKET: djafat-ci
      OBJECT_STORAGE_ACCESS_KEY_ID: ci
      OBJECT_STORAGE_SECRET_ACCESS_KEY: ci
      API_PUBLIC_URL: http://localhost:3001
      PAYMENT_WEBHOOK_BASE_URL: http://localhost:3001/v1/payments/webhook
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @djafat/api run db:generate

      - name: Apply migrations
        run: pnpm --filter @djafat/api run db:migrate

      - name: Seed
        run: pnpm --filter @djafat/api run db:seed

      - name: Integration tests
        run: pnpm --filter @djafat/api run test:int
