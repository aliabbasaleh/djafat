name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 4 * * 1' # weekly, Monday 04:00 UTC

# A newer push to the same pull request replaces the run still going (it
# scans that newer state anyway). Runs on main are never cancelled.
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    name: gitleaks (secret scanning)
    runs-on: ubuntu-latest
    # Least privilege for the per-run token: read the code, and list the
    # commits of a pull request (GET /pulls/{n}/commits) — the repository's
    # default token permissions do not include pull-requests (403 otherwise).
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
          # Required by gitleaks-action@v2 to scan `pull_request` events (it
          # lists the PR's commits through the API); without it the job fails
          # before scanning anything. Never a secret of ours: the per-run token.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  audit:
    name: pnpm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # New production advisories fail; the pre-existing ones (Expo/React
      # Native, identical to main at adoption) are listed by id in
      # scripts/pipeline/baselines/audit.json and reduced by the Expo upgrade.
      # A plain `pnpm audit --audit-level high` was already red on that debt,
      # so it could not tell a NEW vulnerable dependency apart (FEAT-007).
      - name: Audit (no advisory beyond the baseline)
        run: pnpm check:audit
