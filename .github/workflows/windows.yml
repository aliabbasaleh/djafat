name: Windows

# Follows docs/TRAVAILLER-EN-LOCAL.md on a Windows machine, so a teammate on a
# Windows PC can run the project. GitHub's Windows runners cannot run the
# Linux containers of `pnpm infra:up` (PostgreSQL + PostGIS, Redis): that part
# is covered on Linux by the CI workflow; everything else is checked here.

on:
  pull_request:
    # ready_for_review: a draft runs its checks when it is marked ready.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  # Which jobs this run needs (scripts/pipeline/ci-scope.mjs): every check on
  # a manual run; on a pull request, nothing heavy while it is a draft, and only the
  # docs checks when the whole pull request is documentation. Saves Actions
  # minutes (the private repository ran out of them on 2026-11-23).
  scope:
    name: scope
    runs-on: ubuntu-latest
    outputs:
      heavy: ${{ steps.scope.outputs.heavy }}
      docs: ${{ steps.scope.outputs.docs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/pipeline/ci-scope.mjs

  local-setup:
    name: local setup on Windows
    needs: scope
    if: needs.scope.outputs.heavy == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: pnpm install (guide step 1)
        run: pnpm install --frozen-lockfile

      - name: pnpm env:init (guide step 2)
        run: pnpm env:init

      - name: Generate Prisma client
        run: pnpm --filter @djafat/api db:generate

      - name: Unit tests
        run: pnpm test:unit

      - name: Build the three web apps (client, admin, restaurant)
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:3001/v1
        run: pnpm turbo run build --filter=@djafat/web --filter=@djafat/admin --filter=@djafat/restaurant --filter=@djafat/api

      - name: Courier app for the browser
        run: pnpm --filter @djafat/courier build:web

      - name: The client site starts and answers
        shell: pwsh
        run: |
          $web = Start-Process -FilePath "pnpm.cmd" -ArgumentList "--filter","@djafat/web","start" -PassThru -NoNewWindow
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            try {
              $r = Invoke-WebRequest -Uri "http://localhost:3000/connexion" -UseBasicParsing -TimeoutSec 5
              if ($r.StatusCode -eq 200 -and $r.Content -match "Connexion") { $ok = $true; break }
            } catch { Start-Sleep -Seconds 2 }
          }
          Stop-Process -Id $web.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { Write-Error "http://localhost:3000/connexion did not answer"; exit 1 }
          Write-Output "OK: http://localhost:3000/connexion answers on Windows"
